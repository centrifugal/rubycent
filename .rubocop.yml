plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

# class Foo < Data.define(...): how YARD documents a Data class.
Style/DataInheritance:
  Enabled: false

# The protos' and the spec's words.
Naming/PredicateMethod:
  Enabled: false

Layout/LineLength:
  Max: 120
  Exclude:
    - "lib/cent/generated/**/*"

Metrics:
  Exclude:
    - "lib/cent/generated/**/*"
    - "gen/**/*"
    - "test/**/*"

Metrics/ClassLength:
  Max: 400

Metrics/ModuleLength:
  Max: 300

Metrics/MethodLength:
  Max: 40

Metrics/AbcSize:
  Max: 45

Metrics/CyclomaticComplexity:
  Max: 20

Metrics/PerceivedComplexity:
  Max: 20

Metrics/BlockLength:
  Exclude:
    - "*.gemspec"

Gemspec/DevelopmentDependencies:
  Enabled: false

# Short names where the meaning is plain: w for the wire form, k and v.
Naming/MethodParameterName:
  MinNameLength: 1

# A member named method - the spec's word for an API method - on a value
# object: RequestInfo, Command, FailedCommand, HTTPRequest, the RPC proxy's
# request.
Lint/DataDefineOverride:
  Enabled: false
Lint/StructNewOverride:
  Exclude:
    - "gen/**/*"

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Cent is documented once, in lib/cent.rb.
Style/Documentation:
  AllowedConstants:
    - Cent

Metrics/ParameterLists:
  Max: 7
  CountKeywordArgs: false

# A test checks a scenario through: its assertions belong together.
Minitest/MultipleAssertions:
  Enabled: false

# Released from CI with an API key, which MFA would refuse.
Gemspec/RequireMFA:
  Enabled: false

# The integration tests' base class.
Minitest/TestFileName:
  Exclude:
    - "test/integration/helper.rb"
