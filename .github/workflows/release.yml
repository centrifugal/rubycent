name: Release to RubyGems

# Pushing a tag v5.1.0 releases the gem: the tag must match Cent::VERSION.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: The tag is the version
        run: |
          version=$(ruby -Ilib -rcent/version -e 'print Cent::VERSION')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cent::VERSION ${version}: set it in lib/cent/version.rb"
            exit 1
          fi
      - run: bundle exec rake generate:check test
      - run: gem build cent.gemspec
      - name: Publish to RubyGems
        run: gem push cent-*.gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
      - name: GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "See [CHANGELOG.md](https://github.com/centrifugal/rubycent/blob/master/CHANGELOG.md)." cent-*.gem
        env:
          GH_TOKEN: ${{ github.token }}
